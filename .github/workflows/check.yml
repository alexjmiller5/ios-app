name: Check signing workflow
on:
  push:
    branches: [main]
  pull_request:
# A newer push to the same ref cancels the older run (cancelled runs send no mail).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  signing-tests:
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: python3 -B scripts/sign_ios_test.py
      - run: python3 -B scripts/ios_workflow_test.py
      - run: python3 -B scripts/ota_install_test.py
